[project]
name = "api"
version = "0.1.0"
description = "Exam Integrity System API"
requires-python = "==3.11.8"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.2.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.5",
]
